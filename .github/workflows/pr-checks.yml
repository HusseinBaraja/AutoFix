name: PR checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\AutoFix.sln
      - name: Build
        run: dotnet build .\AutoFix.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test .\tests\AutoFix.Tests\AutoFix.Tests.csproj --configuration Release --no-build
      - name: Publish single-file app
        run: .\scripts\publish.ps1
        shell: pwsh
